[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swag-converter"
version = "0.1.0"
description = "Local, high-quality raster to vector conversion with real SVG gradients"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["svg", "vector", "vectorization", "tracing", "raster", "image", "converter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "rich>=13.0",
  "scikit-image>=0.22",
  "scipy>=1.10",
]

[project.optional-dependencies]
# Enables the similarity score; conversion works without it.
quality = ["CairoSVG>=2.7"]
dev = ["pytest>=8.0", "CairoSVG>=2.7"]

[project.scripts]
swag = "swag_converter.cli:main"
swag-converter = "swag_converter.cli:main"

[project.urls]
Homepage = "https://github.com/nerf-file/swag-converter"
Issues = "https://github.com/nerf-file/swag-converter/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes several seconds; deselect with -m 'not slow'"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
