name: Release

# Tagging v1.2.3 builds the package, publishes it to PyPI and attaches the
# same artifacts to the GitHub release.  No tokens live in this repository:
# PyPI trusts the workflow itself (Trusted Publishing), which is why the
# publish job needs `id-token: write` and the `pypi` environment.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refuse a tag that disagrees with pyproject
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - run: pip install build twine
      - run: python -m build
      - name: Check the metadata renders on PyPI
        run: twine check --strict dist/*

      - name: Prove the wheel installs and converts
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          python examples/make_samples.py
          /tmp/check/bin/swag examples/badge.png --out /tmp/svg --no-measure
          test -s /tmp/svg/badge.svg

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # mints the short-lived token PyPI verifies
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # uploads the assets onto the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Checksum the artifacts
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
