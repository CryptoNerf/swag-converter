name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Cairo (for the similarity score)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Smoke-test the CLI
        run: |
          python examples/make_samples.py
          swag examples/badge.png --out /tmp/out --json --no-measure
          test -f /tmp/out/badge.svg
